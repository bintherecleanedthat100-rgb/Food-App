<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Making Food">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>Making Food</title>
<style>
:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --surface-2: #f0ece6;
  --text: #1d1b19;
  --muted: #6c665f;
  --line: #e4dfd8;
  --accent: #b0502a;
  --accent-text: #ffffff;
  --danger: #b3261e;
  --star: #c0820f;
  --tile-text: #3b2f26;
  --t1: #f3dccb; --t2: #dfe8d3; --t3: #d9e4ee; --t4: #efe0b9; --t5: #ead6e0; --t6: #d6e6e0;
  --radius: 16px;
  --gutter-l: calc(env(safe-area-inset-left) + 16px);
  --gutter-r: calc(env(safe-area-inset-right) + 16px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141210;
    --surface: #1f1c19;
    --surface-2: #2b2723;
    --text: #f2eee9;
    --muted: #a59f98;
    --line: #37322d;
    --accent: #e3804f;
    --accent-text: #1a0f08;
    --danger: #f2867d;
    --star: #f0b54a;
    --tile-text: #f3e9df;
    --t1: #4a3426; --t2: #34412c; --t3: #2c3a47; --t4: #4a3f22; --t5: #45303b; --t6: #2b403a;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font: 17px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
body.locked { overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }
svg { display: block; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Main screen */
.top {
  position: sticky; top: 0; z-index: 5;
  display: flex; justify-content: center;
  padding: calc(env(safe-area-inset-top) + 10px) var(--gutter-r) 10px var(--gutter-l);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: saturate(1.6) blur(14px);
  backdrop-filter: saturate(1.6) blur(14px);
}
.seg { display: flex; width: min(100%, 220px); padding: 3px; border-radius: 12px; background: var(--surface-2); }
.seg button, .seg label { flex: 1; }
.seg button, .seg span {
  display: flex; align-items: center; justify-content: center;
  min-height: 40px; border-radius: 9px;
  font-size: 16px; font-weight: 600; color: var(--muted);
}
.seg button[aria-pressed="true"], .seg input:checked + span {
  background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .14);
}
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg input:focus-visible + span { outline: 2px solid var(--accent); }
.menu-btn {
  position: absolute; right: calc(env(safe-area-inset-right) + 6px); bottom: 8px;
  width: 44px; height: 44px; display: grid; place-items: center; color: var(--muted);
}
.menu-btn svg { width: 22px; height: 22px; }

.grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 18px 12px;
  padding: 8px var(--gutter-r) calc(env(safe-area-inset-bottom) + 100px) var(--gutter-l);
  max-width: 900px; margin: 0 auto;
}
.card { display: flex; flex-direction: column; gap: 8px; min-width: 0; text-align: left; }
.card-media { aspect-ratio: 1; border-radius: var(--radius); overflow: hidden; background: var(--surface-2); transition: transform .15s; }
.card:active .card-media { transform: scale(.97); }
.card-media img { width: 100%; height: 100%; object-fit: cover; }
.card-name {
  font-size: 15px; font-weight: 600; line-height: 1.25;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.tile {
  display: flex; align-items: center; justify-content: center; height: 100%;
  padding: 14px; text-align: center; color: var(--tile-text); background: var(--tile);
}
.tile span {
  font-size: 22px; font-weight: 700; line-height: 1.15; letter-spacing: -.01em; overflow-wrap: anywhere;
  display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden;
}
.tile.long span { font-size: 18px; }
.t1 { --tile: var(--t1); } .t2 { --tile: var(--t2); } .t3 { --tile: var(--t3); }
.t4 { --tile: var(--t4); } .t5 { --tile: var(--t5); } .t6 { --tile: var(--t6); }
.empty { text-align: center; color: var(--muted); padding: 48px 24px; margin: 0; }
.fab {
  position: fixed; z-index: 6;
  right: calc(env(safe-area-inset-right) + 20px); bottom: calc(env(safe-area-inset-bottom) + 20px);
  width: 60px; height: 60px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--accent); color: var(--accent-text);
  box-shadow: 0 6px 20px rgba(0, 0, 0, .25);
}
.fab svg { width: 28px; height: 28px; }

/* Sheets */
.sheet {
  position: fixed; inset: 0; z-index: 20;
  display: flex; flex-direction: column;
  background: var(--bg);
  transform: translateY(100%); visibility: hidden;
  transition: transform .3s cubic-bezier(.2, .8, .2, 1), visibility 0s linear .3s;
}
.sheet.open { transform: none; visibility: visible; transition: transform .3s cubic-bezier(.2, .8, .2, 1); }
.sheet.layer2 { z-index: 30; }
@media (prefers-reduced-motion: reduce) { .sheet, .sheet.open { transition: none; } }
.sheet-scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.bar {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding: calc(env(safe-area-inset-top) + 6px) calc(env(safe-area-inset-right) + 6px) 6px calc(env(safe-area-inset-left) + 6px);
  border-bottom: 1px solid var(--line);
}
.bar h2 { margin: 0; font-size: 17px; }
.text-btn { min-height: 44px; padding: 0 10px; color: var(--accent); font-size: 17px; }
.bar .text-btn:first-child { justify-self: start; }
.bar .text-btn:last-child { justify-self: end; font-weight: 700; }
.bottom-bar {
  display: flex; gap: 12px;
  padding: 12px var(--gutter-r) calc(env(safe-area-inset-bottom) + 12px) var(--gutter-l);
  border-top: 1px solid var(--line); background: var(--bg);
}
.btn { flex: 1; min-height: 52px; border-radius: 14px; font-size: 17px; font-weight: 700; }
.btn.primary { background: var(--accent); color: var(--accent-text); }
.btn.secondary { background: var(--surface-2); }
.btn.danger { width: 100%; margin-top: 12px; color: var(--danger); border: 1px solid var(--line); }

/* Recipe view */
.hero { position: relative; width: 100%; aspect-ratio: 4 / 3; max-height: 58vh; background: var(--surface-2); }
.hero img { width: 100%; height: 100%; object-fit: cover; }
.hero .tile span { font-size: 34px; }
.close-btn {
  position: absolute;
  top: calc(env(safe-area-inset-top) + 12px); left: calc(env(safe-area-inset-left) + 12px);
  width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center;
  background: rgba(0, 0, 0, .45); color: #fff;
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
.close-btn svg { width: 22px; height: 22px; }
.content { max-width: 720px; margin: 0 auto; padding: 20px calc(env(safe-area-inset-right) + 20px) 32px calc(env(safe-area-inset-left) + 20px); }
.title { margin: 0 0 14px; font-size: 28px; line-height: 1.15; letter-spacing: -.02em; }
.section { margin: 30px 0 8px; font-size: 20px; }
.label { font-size: 14px; font-weight: 600; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.prose { margin: 0; white-space: pre-wrap; }
.last-time { margin: 0 0 16px; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.last-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.last-note { margin: 6px 0 0; }
.stars { display: inline-flex; gap: 2px; color: var(--star); }
.stars svg { width: 16px; height: 16px; }
.off { opacity: .25; }
.servings {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 6px 6px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line);
}
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-2); }
.stepper button:disabled { opacity: .35; }
.stepper svg { width: 20px; height: 20px; }
.stepper output { min-width: 40px; text-align: center; font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
.scaled-note { margin: 6px 0 0; }
.checklist, .steps, .rows { list-style: none; margin: 0; padding: 0; }
.check {
  display: flex; align-items: flex-start; gap: 12px; width: 100%; min-height: 48px;
  padding: 11px 0; text-align: left; border-bottom: 1px solid var(--line);
}
.box { flex: none; width: 24px; height: 24px; margin-top: 1px; border-radius: 7px; border: 2px solid var(--muted); display: grid; place-items: center; }
.box svg { width: 16px; height: 16px; opacity: 0; }
.check[aria-checked="true"] .box { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.check[aria-checked="true"] .box svg { opacity: 1; }
.check[aria-checked="true"] .ing-text { color: var(--muted); text-decoration: line-through; }
.qty { font-weight: 700; }
.steps li { display: flex; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.num { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-size: 15px; font-weight: 700; }
.steps p { margin: 2px 0 0; }
.timer { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
.timer-btn {
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px;
  border-radius: 22px; background: var(--surface-2); font-weight: 600; font-variant-numeric: tabular-nums;
}
.timer-btn svg { width: 18px; height: 18px; }
.timer-btn.running { background: var(--accent); color: var(--accent-text); }
.timer-btn.done { background: var(--text); color: var(--bg); }
.timer-reset { min-height: 44px; padding: 0 12px; color: var(--muted); font-weight: 600; }
.timeline {
  display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x proximity;
  margin: 0 calc(-20px - env(safe-area-inset-right)) 0 calc(-20px - env(safe-area-inset-left));
  padding: 4px calc(env(safe-area-inset-right) + 20px) 8px calc(env(safe-area-inset-left) + 20px);
}
.log-item { flex: none; width: 168px; text-align: left; scroll-snap-align: start; }
.log-media { aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: var(--surface-2); margin-bottom: 8px; }
.log-media img { width: 100%; height: 100%; object-fit: cover; }
.log-media .tile span { font-size: 16px; }
.log-meta { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 14px; }
.log-change { margin: 4px 0 0; font-size: 14px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

/* Forms */
.form { padding: 16px var(--gutter-r) calc(env(safe-area-inset-bottom) + 40px) var(--gutter-l); max-width: 720px; margin: 0 auto; width: 100%; }
.field { display: block; min-width: 0; margin: 0 0 22px; padding: 0; border: 0; }
.field > span, .field > legend { display: block; margin-bottom: 6px; padding: 0; font-size: 14px; font-weight: 600; color: var(--muted); }
.form input:not([type="radio"]):not([type="checkbox"]), .form textarea {
  width: 100%; min-height: 44px; padding: 10px 12px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
  font-size: 16px; /* 16px stops iOS from zooming into focused fields */
}
.form textarea { min-height: 88px; resize: vertical; }
.form [aria-invalid="true"] { border-color: var(--danger) !important; }
.form .seg { width: 100%; }
.hint { margin: -2px 0 10px; font-size: 13px; color: var(--muted); }
.rows { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: flex-start; gap: 6px; background: var(--bg); }
.row.dragging { position: relative; z-index: 1; border-radius: 12px; background: var(--surface); box-shadow: 0 6px 20px rgba(0, 0, 0, .2); }
.drag, .del { flex: none; min-height: 44px; display: grid; place-items: center; color: var(--muted); }
.drag { width: 30px; touch-action: none; cursor: grab; }
.del { width: 36px; }
.drag svg, .del svg { width: 20px; height: 20px; }
.rows > .row { padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.ing-fields { flex: 1; min-width: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-areas: "name name" "amt unit"; gap: 6px; }
.ing-fields .name { grid-area: name; }
.ing-fields .amt { grid-area: amt; }
.ing-fields .unit { grid-area: unit; }
.step-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.step-head { display: flex; align-items: center; gap: 8px; }
.form .step-main textarea { min-height: 72px; overflow: hidden; }
.timer-field { display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--muted); }
.form .timer-field input.min { flex: 0 0 96px; width: 96px; }
.log-servings { margin: 0 0 22px; }
.cover-actions { display: flex; gap: 8px; margin-left: -10px; }
.add-row { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; margin-top: 8px; color: var(--accent); font-weight: 600; }
.add-row svg { width: 20px; height: 20px; }
.versions { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.versions li { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; border-bottom: 1px solid var(--line); }
.versions .text-btn { flex: none; font-weight: 600; }
.log-photo { position: relative; aspect-ratio: 4 / 3; margin-bottom: 4px; border-radius: 16px; overflow: hidden; background: var(--surface-2); }
.log-photo img { width: 100%; height: 100%; object-fit: cover; }
.photo-placeholder { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--muted); font-weight: 600; }
.photo-placeholder svg { width: 36px; height: 36px; }
.retake { display: block; margin: 0 0 18px; }
.stars-input { display: flex; gap: 4px; color: var(--star); }
.stars-input button { width: 52px; height: 52px; display: grid; place-items: center; }
.stars-input svg { width: 36px; height: 36px; }
.check-row { display: flex; align-items: center; gap: 12px; min-height: 48px; }
.check-row input { width: 22px; height: 22px; accent-color: var(--accent); }

/* Action sheet and toast */
.action-backdrop {
  position: fixed; inset: 0; z-index: 40;
  display: flex; align-items: flex-end; justify-content: center;
  padding: 0 8px calc(env(safe-area-inset-bottom) + 8px);
  background: rgba(0, 0, 0, .4);
}
.action-panel { width: min(100%, 480px); display: flex; flex-direction: column; gap: 8px; }
.action-list { border-radius: 14px; overflow: hidden; background: var(--surface); }
.action-title { margin: 0; padding: 12px 16px; text-align: center; font-size: 13px; color: var(--muted); border-bottom: 1px solid var(--line); }
.action-list button { display: block; width: 100%; min-height: 56px; font-size: 18px; color: var(--accent); }
.action-list button + button { border-top: 1px solid var(--line); }
.action-list .destructive { color: var(--danger); }
.action-cancel { min-height: 56px; border-radius: 14px; background: var(--surface); color: var(--accent); font-size: 18px; font-weight: 700; }
.toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 96px); z-index: 50;
  max-width: calc(100% - 32px); padding: 12px 18px; border-radius: 12px;
  background: var(--text); color: var(--bg); font-size: 15px; font-weight: 600; text-align: center;
  opacity: 0; transform: translate(-50%, 16px); pointer-events: none; transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<header class="top">
  <div class="seg" role="group" aria-label="Category">
    <button type="button" data-cat="chicken" aria-pressed="true">Chicken</button>
    <button type="button" data-cat="beef" aria-pressed="false">Beef</button>
  </div>
  <button type="button" class="menu-btn" id="menuBtn" aria-label="More"></button>
</header>
<main id="grid" class="grid" aria-live="polite"></main>
<p id="empty" class="empty" hidden></p>
<button type="button" class="fab" id="addBtn" aria-label="Add recipe"></button>

<section class="sheet" id="viewSheet" role="dialog" aria-modal="true" aria-label="Recipe" aria-hidden="true">
  <div class="sheet-scroll" id="viewBody"></div>
  <div class="bottom-bar">
    <button type="button" class="btn secondary" id="editBtn">Edit</button>
    <button type="button" class="btn primary" id="madeBtn">I made this</button>
  </div>
</section>

<section class="sheet layer2" id="editSheet" role="dialog" aria-modal="true" aria-labelledby="editHeading" aria-hidden="true">
  <div class="bar">
    <button type="button" class="text-btn" id="cancelEdit">Cancel</button>
    <h2 id="editHeading">Edit recipe</h2>
    <button type="button" class="text-btn" id="saveEdit">Save</button>
  </div>
  <form class="sheet-scroll" id="editScroll" novalidate><div class="form" id="editForm"></div></form>
</section>

<section class="sheet layer2" id="logSheet" role="dialog" aria-modal="true" aria-labelledby="logHeading" aria-hidden="true">
  <div class="bar">
    <button type="button" class="text-btn" id="cancelLog">Cancel</button>
    <h2 id="logHeading">I made this</h2>
    <button type="button" class="text-btn" id="saveLog">Save</button>
  </div>
  <form class="sheet-scroll" novalidate><div class="form" id="logForm"></div></form>
</section>

<div class="action-backdrop" id="actionSheet" hidden>
  <div class="action-panel" role="dialog" aria-modal="true">
    <div class="action-list" id="actionList"></div>
    <button type="button" class="action-cancel" id="actionCancel">Cancel</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
<input type="file" id="importInput" accept="application/json,.json" hidden>
<input type="file" id="coverInput" accept="image/*" hidden>

<script>
'use strict';

/* ---------- Seed recipes ---------- */

const I = (amount, unit, name) => ({ amount, unit, name });
const S = (text, minutes) => ({ text, timerSec: minutes ? Math.round(minutes * 60) : null });

const SEED_RECIPES = [
  {
    id: 'chicken-shawarma-bowl',
    title: 'Chicken Shawarma Bowl',
    category: 'chicken',
    baseServings: 4,
    ingredients: [
      I(3, 'lb', 'boneless skinless chicken thighs'),
      I(1/4, 'cup', 'extra virgin olive oil'),
      I(3, 'tbsp', 'fresh lemon juice'),
      I(6, 'clove', 'garlic, minced'),
      I(1, 'tbsp', 'ground cumin'),
      I(1, 'tbsp', 'smoked paprika'),
      I(2, 'tsp', 'ground coriander'),
      I(1, 'tsp', 'ground turmeric'),
      I(1/2, 'tsp', 'ground cinnamon'),
      I(1/4, 'tsp', 'cayenne pepper'),
      I(2, 'tsp', 'kosher salt'),
      I(1, 'tsp', 'black pepper'),
      I(2, 'cup', 'jasmine rice, uncooked'),
      I(3, 'cup', 'chicken broth'),
      I(1, 'tbsp', 'butter'),
      I(1, '', 'English cucumber, diced'),
      I(1, 'pint', 'cherry tomatoes, halved'),
      I(1/2, '', 'red onion, thinly sliced'),
      I(1/4, 'cup', 'fresh parsley, chopped'),
      I(1, 'cup', 'plain whole-milk Greek yogurt (garlic sauce)'),
      I(1, 'clove', 'garlic, finely grated (garlic sauce)'),
      I(1, 'tbsp', 'fresh lemon juice (garlic sauce)'),
      I(1/4, 'tsp', 'kosher salt (garlic sauce)'),
    ],
    steps: [
      S('Whisk the olive oil, 3 tbsp lemon juice, minced garlic, cumin, paprika, coriander, turmeric, cinnamon, cayenne, salt, and pepper in a large bowl. Add the chicken and turn to coat. Cover and marinate in the fridge for at least 1 hour (up to 24 hours).', 60),
      S('Rinse the rice until the water runs mostly clear. Bring the rice, broth, and butter to a boil in a saucepan, then cover, turn the heat to low, and simmer.', 15),
      S('Take the rice off the heat and let it steam, still covered. Fluff with a fork.', 10),
      S('Air fry the chicken at 380°F in a single layer (work in batches), flipping halfway, until the thickest piece reads 165°F inside.', 20),
      S('Rest the chicken on a cutting board, then slice into strips.', 5),
      S('Stir together the yogurt, grated garlic, 1 tbsp lemon juice, and 1/4 tsp salt for the garlic sauce.'),
      S('Build bowls: rice, a generous pile of chicken, cucumber, tomatoes, red onion, and parsley. Spoon garlic sauce over the top.'),
    ],
    mealPrep: 'Divide the rice and chicken into 4 containers. Pack the cucumber, tomatoes, onion, and garlic sauce in separate small containers so they stay crisp and cold. Refrigerate up to 4 days. The cooked chicken and rice also freeze well for up to 3 months (leave out the vegetables and sauce).',
    reheat: 'Air fry the chicken at 375°F for 4 to 6 minutes, shaking once, until hot throughout (165°F). Microwave the rice separately, covered, with a splash of water for 1 to 2 minutes. Add the cold toppings and sauce after reheating.',
  },

/* ---------- Amounts ---------- */

// Scaled amounts are shown as the nearest kitchen fraction so "0.6667 cup" reads as "2/3 cup".
const DISPLAY_FRACTIONS = [[0, ''], [1/8, '⅛'], [1/4, '¼'], [1/3, '⅓'], [3/8, '⅜'], [1/2, '½'], [5/8, '⅝'], [2/3, '⅔'], [3/4, '¾'], [7/8, '⅞'], [1, '']];
const EDIT_FRACTIONS = [[1/8, '1/8'], [1/4, '1/4'], [1/3, '1/3'], [3/8, '3/8'], [1/2, '1/2'], [5/8, '5/8'], [2/3, '2/3'], [3/4, '3/4'], [7/8, '7/8']];

function formatAmount(n) {
  if (n == null || !(n > 0)) return '';
  let whole = Math.floor(n);
  const frac = n - whole;
  let best = DISPLAY_FRACTIONS[0];
  for (const f of DISPLAY_FRACTIONS) if (Math.abs(frac - f[0]) < Math.abs(frac - best[0])) best = f;
  if (Math.abs(frac - best[0]) > 0.04) return String(Math.round(n * 100) / 100);
  if (best[0] === 1) { whole += 1; best = DISPLAY_FRACTIONS[0]; }
  if (whole === 0 && !best[1]) return String(Math.round(n * 100) / 100);
  return `${whole || ''}${best[1]}`;
}

// The edit form shows exact values so that saving without changes never alters an amount.
function formatAmountForEdit(n) {
  if (n == null) return '';
  const whole = Math.floor(n);
  const frac = n - whole;
  if (frac < 1e-9) return String(whole);
  const f = EDIT_FRACTIONS.find(([v]) => Math.abs(v - frac) < 1e-9);
  if (f) return whole ? `${whole} ${f[1]}` : f[1];
  return String(n);
}

// Returns a positive number, null for blank or zero ("to taste"), or NaN when unreadable.
function parseAmount(text) {
  const t = text.trim();
  if (!t) return null;
  let m;
  let value = NaN;
  if ((m = t.match(/^(\d+)\s+(\d+)\/(\d+)$/))) value = Number(m[3]) ? Number(m[1]) + Number(m[2]) / Number(m[3]) : NaN;
  else if ((m = t.match(/^(\d+)\/(\d+)$/))) value = Number(m[2]) ? Number(m[1]) / Number(m[2]) : NaN;
  else if (/^(\d+\.?\d*|\.\d+)$/.test(t)) value = Number(t);
  return value === 0 ? null : value;
}

const PLURAL_UNITS = { cup: 'cups', clove: 'cloves', can: 'cans', pint: 'pints', sprig: 'sprigs', stalk: 'stalks', bunch: 'bunches', head: 'heads', slice: 'slices' };

function ingredientParts(ing, scale) {
  const amount = ing.amount == null ? null : ing.amount * scale;
  const qty = [formatAmount(amount), amount > 1 && PLURAL_UNITS[ing.unit] ? PLURAL_UNITS[ing.unit] : ing.unit].filter(Boolean).join(' ');
  return { qty, name: ing.name };
}

function formatDuration(ms) {
  const total = Math.ceil(ms / 1000);
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}` : `${m}:${String(s).padStart(2, '0')}`;
}

function minutesForEdit(sec) {
  return sec ? String(Math.round((sec / 60) * 100) / 100) : '';
}

/* ---------- Data model ---------- */

const str = v => (typeof v === 'string' ? v : '');
const list = v => (Array.isArray(v) ? v : []);
const posInt = (v, fallback) => {
  const n = Math.round(Number(v));
  return Number.isFinite(n) && n >= 1 ? n : fallback;
};

function normalizeFields(src) {
  if (!src || typeof src !== 'object') throw new Error('a recipe version is damaged.');
  if (!CATEGORIES.includes(src.category)) throw new Error(`unknown category "${src.category}".`);
  return {
    title: str(src.title).trim() || 'Untitled recipe',
    category: src.category,
    baseServings: posInt(src.baseServings, 4),
    ingredients: list(src.ingredients)
      .map(i => ({ amount: Number(i?.amount) > 0 ? Number(i.amount) : null, unit: str(i?.unit).trim(), name: str(i?.name).trim() }))
      .filter(i => i.name),
    steps: list(src.steps)
      .map(s => ({ text: str(s?.text).trim(), timerSec: Number(s?.timerSec) > 0 ? Math.round(Number(s.timerSec)) : null }))
      .filter(s => s.text),
    mealPrep: str(src.mealPrep).trim(),
    reheat: str(src.reheat).trim(),
    notes: str(src.notes).trim(),
  };
}

function normalizeRecipe(r) {
  if (!r || typeof r !== 'object') throw new Error('a recipe in the file is damaged.');
  if (typeof r.id !== 'string' || !r.id) throw new Error('a recipe in the file has no id.');
  const fields = normalizeFields(r);
  return {
    id: r.id,
    ...fields,
    coverPhotoId: str(r.coverPhotoId) || null,
    versions: list(r.versions).map(v => ({ replacedAt: str(v?.replacedAt), snapshot: normalizeFields(v?.snapshot) })),
    cookLog: list(r.cookLog).map(e => ({
      id: str(e?.id) || uid('c'),
      date: /^\d{4}-\d{2}-\d{2}$/.test(str(e?.date)) ? e.date : todayISO(),
      photoId: str(e?.photoId) || null,
      rating: Math.min(5, Math.max(1, Math.round(Number(e?.rating)) || 1)),
      changeNextTime: str(e?.changeNextTime).trim(),
      servingsMade: posInt(e?.servingsMade, fields.baseServings),
    })),
  };
}

// The editable part of a recipe. Version history stores exactly this.
function snapshotOf(r) {
  return {
    title: r.title,
    category: r.category,
    baseServings: r.baseServings,
    ingredients: r.ingredients.map(i => ({ amount: i.amount, unit: i.unit, name: i.name })),
    steps: r.steps.map(s => ({ text: s.text, timerSec: s.timerSec })),
    mealPrep: r.mealPrep,
    reheat: r.reheat,
    notes: r.notes,
  };
}

function entriesNewestFirst(r) {
  return r.cookLog
    .map((entry, index) => ({ entry, index }))
    .sort((a, b) => b.entry.date.localeCompare(a.entry.date) || b.index - a.index)
    .map(x => x.entry);
}

/* ---------- IndexedDB ---------- */

const DB_NAME = 'making-food';
let dbPromise;

function openDB() {
  dbPromise ||= new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      db.createObjectStore('recipes', { keyPath: 'id' });
      // Photos are stored as ArrayBuffers rather than Blobs; older iOS versions were unreliable with Blobs in IndexedDB.
      db.createObjectStore('photos', { keyPath: 'id' });
      db.createObjectStore('meta');
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}

async function run(stores, mode, fn) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(stores, mode);
    let result;
    const req = fn(tx);
    if (req && 'onsuccess' in req) req.onsuccess = () => { result = req.result; };
    tx.oncomplete = () => resolve(result);
    tx.onerror = tx.onabort = () => reject(tx.error || new Error('Storage error'));
  });
}

const db = {
  allRecipes: () => run('recipes', 'readonly', tx => tx.objectStore('recipes').getAll()),
  putRecipe: r => run('recipes', 'readwrite', tx => tx.objectStore('recipes').put(r)),
  deleteRecipe: id => run('recipes', 'readwrite', tx => tx.objectStore('recipes').delete(id)),
  getPhoto: id => run('photos', 'readonly', tx => tx.objectStore('photos').get(id)),
  allPhotos: () => run('photos', 'readonly', tx => tx.objectStore('photos').getAll()),
  photoIds: () => run('photos', 'readonly', tx => tx.objectStore('photos').getAllKeys()),
  getMeta: key => run('meta', 'readonly', tx => tx.objectStore('meta').get(key)),
};

async function seedIfNeeded() {
  if (await db.getMeta('seeded')) return;
  const recipes = SEED_RECIPES.map(r => normalizeRecipe({ ...r, coverPhotoId: null, notes: '', versions: [], cookLog: [] }));
  await run(['recipes', 'meta'], 'readwrite', tx => {
    const store = tx.objectStore('recipes');
    recipes.forEach(r => store.put(r));
    tx.objectStore('meta').put(true, 'seeded');
  });
}

const photoURLs = new Map();
async function photoURL(id) {
  if (!photoURLs.has(id)) {
    const photo = await db.getPhoto(id);
    if (!photo) return null;
    photoURLs.set(id, URL.createObjectURL(new Blob([photo.data], { type: photo.type })));
  }
  return photoURLs.get(id);
}

function forgetPhotoURLs(ids) {
  for (const id of ids ?? [...photoURLs.keys()]) {
    if (photoURLs.has(id)) URL.revokeObjectURL(photoURLs.get(id));
    photoURLs.delete(id);
  }
}

// Removes photos no recipe points to any more (after deleting a log entry or a recipe).
async function deleteUnusedPhotos() {
  const used = new Set();
  for (const r of state.recipes) {
    if (r.coverPhotoId) used.add(r.coverPhotoId);
    r.cookLog.forEach(e => e.photoId && used.add(e.photoId));
  }
  const unused = (await db.photoIds()).filter(id => !used.has(id));
  if (!unused.length) return;
  await run('photos', 'readwrite', tx => {
    const store = tx.objectStore('photos');
    unused.forEach(id => store.delete(id));
  });
  forgetPhotoURLs(unused);
}

async function saveRecipe(recipe) {
  await db.putRecipe(recipe);
  const i = state.recipes.findIndex(r => r.id === recipe.id);
  if (i >= 0) state.recipes[i] = recipe; else state.recipes.push(recipe);
}

function tileClass(id) {
  let hash = 0;
  for (const ch of id) hash = (hash * 31 + ch.charCodeAt(0)) >>> 0;
  return `t${(hash % 6) + 1}`;
}

/* ---------- Sheets ---------- */

function openSheet(el) {
  el.classList.add('open');
  el.setAttribute('aria-hidden', 'false');
  document.body.classList.add('locked');
}

function closeSheet(el) {
  el.classList.remove('open');
  el.setAttribute('aria-hidden', 'true');
  if (!document.querySelector('.sheet.open')) document.body.classList.remove('locked');
}

function chooseAction(title, actions) {
  const sheet = $('#actionSheet');
  const listEl = $('#actionList');
  listEl.innerHTML = (title ? `<p class="action-title">${esc(title)}</p>` : '') +
    actions.map(a => `<button type="button" data-id="${esc(a.id)}" class="${a.destructive ? 'destructive' : ''}">${esc(a.label)}</button>`).join('');
  sheet.hidden = false;
  return new Promise(resolve => {
    const finish = id => {
      sheet.hidden = true;
      sheet.onclick = null;
      resolve(id);
    };
    sheet.onclick = e => {
      const btn = e.target.closest('button');
      if (btn?.dataset.id) finish(btn.dataset.id);
      else if (btn?.id === 'actionCancel' || e.target === sheet) finish(null);
    };
  });
}

function setCategory(category) {
  state.category = category;
  try { localStorage.setItem('category', category); } catch { /* storage can be unavailable; the default works */ }
  document.querySelectorAll('.top [data-cat]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.cat === category)));
  renderGrid();
}

function renderGrid() {
  const grid = $('#grid');
  const recipes = state.recipes
    .filter(r => r.category === state.category)
    .sort((a, b) => a.title.localeCompare(b.title));
  grid.innerHTML = recipes.map(r => `
    <button type="button" class="card" data-id="${esc(r.id)}">
      <div class="card-media">${r.coverPhotoId
        ? `<img alt="" data-photo="${esc(r.coverPhotoId)}">`
        : `<div class="tile ${tileClass(r.id)} ${r.title.length > 34 ? 'long' : ''}"><span>${esc(r.title)}</span></div>`}</div>
      <span class="card-name">${esc(r.title)}</span>
    </button>`).join('');
  const empty = $('#empty');
  empty.hidden = recipes.length > 0;
  empty.textContent = `No ${state.category} recipes yet. Tap + to add one.`;
  hydratePhotos(grid);
}

async function hydratePhotos(root) {
  for (const img of root.querySelectorAll('img[data-photo]')) {
    const url = await photoURL(img.dataset.photo);
    if (url) img.src = url;
    else img.remove();
  }
}

/* ---------- Step timers ---------- */

// Timers store an absolute end time, so they stay correct even if iOS pauses the page in the background.
const timers = new Map();
let tickHandle = null;
let audioCtx = null;
let wakeLock = null;

const timerKey = (recipeId, stepIndex) => `${recipeId}#${stepIndex}`;

function timerRemaining(t) {
  return t.endAt ? Math.max(0, t.endAt - Date.now()) : t.remainingMs;
}

function toggleTimer(key, totalSec) {
  unlockAudio();
  const t = timers.get(key);
  if (!t) timers.set(key, { remainingMs: totalSec * 1000, endAt: Date.now() + totalSec * 1000, done: false });
  else if (t.done) timers.delete(key);
  else if (t.endAt) { t.remainingMs = timerRemaining(t); t.endAt = null; }
  else t.endAt = Date.now() + t.remainingMs;
  tick();
}

function clearTimersFor(recipeId) {
  for (const key of [...timers.keys()]) if (key.startsWith(`${recipeId}#`)) timers.delete(key);
  tick();
}

function tick() {
  for (const [key, t] of timers) {
    if (t.endAt && t.endAt <= Date.now()) {
      t.endAt = null;
      t.remainingMs = 0;
      t.done = true;
      timerFinished(key);
    }
  }
  renderTimers();
  const running = [...timers.values()].some(t => t.endAt);
  if (running && !tickHandle) tickHandle = setInterval(tick, 250);
  if (!running && tickHandle) { clearInterval(tickHandle); tickHandle = null; }
  updateWakeLock(running);
}

function renderTimers() {
  document.querySelectorAll('#viewBody .timer').forEach(el => {
    const t = timers.get(el.dataset.timer);
    const totalMs = Number(el.dataset.sec) * 1000;
    let cls = '';
    let icon = ICONS.clock;
    let label = `Start ${formatDuration(totalMs)}`;
    let aria = `Start ${formatDuration(totalMs)} timer for step ${el.dataset.step}`;
    if (t?.done) { cls = 'done'; icon = ICONS.check; label = 'Done'; aria = 'Timer done. Tap to clear.'; }
    else if (t?.endAt) { cls = 'running'; icon = ICONS.pause; label = formatDuration(timerRemaining(t)); aria = `${label} left. Tap to pause.`; }
    else if (t) { icon = ICONS.play; label = `${formatDuration(t.remainingMs)} paused`; aria = `Paused at ${formatDuration(t.remainingMs)}. Tap to resume.`; }
    const html = `<button type="button" class="timer-btn ${cls}" data-action="timer-toggle" aria-label="${esc(aria)}">${icon}<span>${esc(label)}</span></button>` +
      (t ? `<button type="button" class="timer-reset" data-action="timer-reset">Reset</button>` : '');
    // Only touch the DOM when the label changes, so a tap landing mid-tick is not lost.
    if (el.dataset.rendered !== html) { el.innerHTML = html; el.dataset.rendered = html; }
  });
}

function timerFinished(key) {
  const [recipeId, index] = [key.slice(0, key.lastIndexOf('#')), Number(key.slice(key.lastIndexOf('#') + 1))];
  const r = getRecipe(recipeId);
  toast(`Timer done${r ? `: ${r.title}, step ${index + 1}` : ''}`);
  navigator.vibrate?.([300, 150, 300, 150, 300]);
  beep();
}

// iOS only lets a page play sound after a tap, so the audio context is unlocked when a timer starts.
function unlockAudio() {
  try {
    audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch { /* no audio available; the toast still shows */ }
}

function beep() {
  if (!audioCtx) return;
  const start = audioCtx.currentTime;
  for (let i = 0; i < 4; i++) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = 880;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const t = start + i * 0.45;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
    osc.start(t);
    osc.stop(t + 0.32);
  }
}

// Keeps the screen awake while a timer runs; a locked phone would pause the countdown alert.
async function updateWakeLock(running) {
  try {
    if (running && !wakeLock && navigator.wakeLock && document.visibilityState === 'visible') {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if (!running && wakeLock) {
      await wakeLock.release();
      wakeLock = null;
    }
  } catch { /* wake lock is optional */ }
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') tick();
});

function readEditForm() {
  const form = editForm();
  const errors = [];
  form.querySelectorAll('[aria-invalid]').forEach(el => el.removeAttribute('aria-invalid'));
  const fail = (el, message) => errors.push({ el, message });

  const titleEl = $('#fTitle', form);
  const title = titleEl.value.trim();
  if (!title) fail(titleEl, 'Add a title.');

  const servingsEl = $('#fServings', form);
  const baseServings = Number(servingsEl.value);
  if (!Number.isInteger(baseServings) || baseServings < 1) fail(servingsEl, 'Base servings must be a whole number, 1 or more.');

  const ingredients = [];
  for (const row of form.querySelectorAll('.ing-row')) {
    const [amtEl, unitEl, nameEl] = ['.amt', '.unit', '.name'].map(s => $(s, row));
    const name = nameEl.value.trim();
    const unit = unitEl.value.trim();
    if (!name && !unit && !amtEl.value.trim()) continue;
    if (!name) fail(nameEl, 'Each ingredient needs a name.');
    const amount = parseAmount(amtEl.value);
    if (Number.isNaN(amount)) fail(amtEl, `"${amtEl.value.trim()}" is not an amount. Use 2, 1/2, 1 1/2, or 0.25.`);
    ingredients.push({ amount: Number.isNaN(amount) ? null : amount, unit, name });
  }

  const steps = [];
  for (const row of form.querySelectorAll('.step-row')) {
    const textEl = $('.text', row);
    const minEl = $('.min', row);
    const text = textEl.value.trim();
    const minText = minEl.value.trim();
    if (!text && !minText) continue;
    if (!text) fail(textEl, 'A step with a timer needs a description.');
    const minutes = minText ? Number(minText) : 0;
    if (!Number.isFinite(minutes) || minutes < 0) fail(minEl, 'Timer minutes must be 0 or more.');
    steps.push({ text, timerSec: minutes > 0 ? Math.round(minutes * 60) : null });
  }

  return {
    errors,
    data: {
      title,
      category: form.querySelector('input[name="category"]:checked')?.value ?? state.category,
      baseServings,
      ingredients,
      steps,
      mealPrep: $('#fMealPrep', form).value.trim(),
      reheat: $('#fReheat', form).value.trim(),
      notes: $('#fNotes', form).value.trim(),
    },
  };
}

async function saveEdit() {
  const { errors, data } = readEditForm();
  if (errors.length) {
    errors.forEach(e => e.el.setAttribute('aria-invalid', 'true'));
    errors[0].el.focus();
    toast(errors[0].message);
    return;
  }
  const existing = state.editing.id ? getRecipe(state.editing.id) : null;
  let recipe;
  if (existing) {
    const before = snapshotOf(existing);
    const changed = JSON.stringify(before) !== JSON.stringify(data);
    recipe = normalizeRecipe({
      ...existing,
      ...data,
      versions: changed ? [...existing.versions, { replacedAt: new Date().toISOString(), snapshot: before }] : existing.versions,
    });
  } else {
    recipe = normalizeRecipe({ id: uid('r'), ...data, coverPhotoId: null, versions: [], cookLog: [] });
  }
  const cover = state.editing.cover;
  const photo = cover ? { id: uid('p'), type: 'image/jpeg', data: await cover.blob.arrayBuffer() } : null;
  if (cover !== undefined) recipe.coverPhotoId = photo?.id ?? null;
  try {
    // Photo and recipe are written in one transaction so the cover can never point at a missing photo.
    await run(['recipes', 'photos'], 'readwrite', tx => {
      if (photo) tx.objectStore('photos').put(photo);
      tx.objectStore('recipes').put(recipe);
    });
  } catch (err) {
    toast(`Could not save: ${err.message}`);
    return;
  }
  const i = state.recipes.findIndex(r => r.id === recipe.id);
  if (i >= 0) state.recipes[i] = recipe; else state.recipes.push(recipe);
  setEditCover(undefined);
  if (cover !== undefined) await deleteUnusedPhotos();
  // Step numbers may have moved, so running timers for this recipe no longer match their steps.
  clearTimersFor(recipe.id);
  state.checks.delete(recipe.id);
  closeSheet($('#editSheet'));
  setCategory(recipe.category);
  if (existing) {
    state.servings = recipe.baseServings;
    renderView();
  } else {
    openView(recipe.id);
  }
  toast('Saved');
}

// Pointer-based drag so reordering works with touch on iOS, where HTML5 drag and drop does not.
// The dragged row never leaves the DOM (its neighbors move around it) so the touch is not cancelled.
function startRowDrag(e) {
  const handle = e.target.closest('.drag');
  if (!handle) return;
  e.preventDefault();
  const row = handle.closest('.row');
  const scroller = $('#editScroll');
  row.classList.add('dragging');
  // Scroll anchoring would cancel the auto-scroll each time the row moves past the anchor.
  scroller.style.overflowAnchor = 'none';
  let y = e.clientY;
  let frame = 0;
  const middle = el => el.getBoundingClientRect().top + el.offsetHeight / 2;
  const place = () => {
    for (;;) {
      const prev = row.previousElementSibling;
      const next = row.nextElementSibling;
      if (prev && y < middle(prev)) row.after(prev);
      else if (next && y > middle(next)) row.before(next);
      else break;
    }
    renumberSteps();
  };
  // Keeps scrolling while the finger rests near an edge, so a row can travel past the visible area.
  const autoScroll = () => {
    const bounds = scroller.getBoundingClientRect();
    const speed = y < bounds.top + 70 ? -12 : y > bounds.bottom - 70 ? 12 : 0;
    if (speed) {
      scroller.scrollBy(0, speed);
      place();
    }
    frame = requestAnimationFrame(autoScroll);
  };
  frame = requestAnimationFrame(autoScroll);
  const move = ev => {
    y = ev.clientY;
    place();
  };
  const end = () => {
    cancelAnimationFrame(frame);
    scroller.style.overflowAnchor = '';
    row.classList.remove('dragging');
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', end);
    window.removeEventListener('pointercancel', end);
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', end);
  window.addEventListener('pointercancel', end);
}

async function compressImage(file, maxWidth = 1200, quality = 0.82) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((resolve, reject) => {
      const el = new Image();
      el.onload = () => resolve(el);
      el.onerror = () => reject(new Error('That photo could not be read.'));
      el.src = url;
    });
    const scale = Math.min(1, maxWidth / img.naturalWidth);
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(img.naturalWidth * scale);
    canvas.height = Math.round(img.naturalHeight * scale);
    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
    if (!blob) throw new Error('That photo could not be saved.');
    return blob;
  } finally {
    URL.revokeObjectURL(url);
  }
}

function renderLogServings() {
  $('#logServings').textContent = state.log.servings;
  $('[data-action="log-servings-down"]').disabled = state.log.servings <= 1;
}

function renderRating() {
  document.querySelectorAll('#logForm [data-action="rate"]').forEach(b => {
    const n = Number(b.dataset.value);
    b.classList.toggle('off', n > state.log.rating);
    b.setAttribute('aria-checked', String(n === state.log.rating));
  });
}

function closeLog() {
  if (state.log?.photo) URL.revokeObjectURL(state.log.photo.url);
  state.log = null;
  closeSheet($('#logSheet'));
}

async function saveLog() {
  const r = getRecipe(state.viewId);
  if (!state.log.rating) { toast('Tap a star rating first.'); return; }
  const date = $('#logDate').value || todayISO();
  const photo = state.log.photo
    ? { id: uid('p'), type: 'image/jpeg', data: await state.log.photo.blob.arrayBuffer() }
    : null;
  const entry = {
    id: uid('c'),
    date,
    photoId: photo?.id ?? null,
    rating: state.log.rating,
    changeNextTime: $('#logChange').value.trim(),
    servingsMade: state.log.servings,
  };
  const updated = {
    ...r,
    cookLog: [...r.cookLog, entry],
    coverPhotoId: photo && $('#logCover').checked ? photo.id : r.coverPhotoId,
  };
  try {
    // Photo and log entry are written in one transaction so neither can exist without the other.
    await run(['recipes', 'photos'], 'readwrite', tx => {
      if (photo) tx.objectStore('photos').put(photo);
      tx.objectStore('recipes').put(updated);
    });
  } catch (err) {
    toast(`Could not save: ${err.message}`);
    return;
  }
  state.recipes[state.recipes.findIndex(x => x.id === r.id)] = updated;
  closeLog();
  renderView();
  renderGrid();
  toast('Added to cook log');
}

async function logEntryActions(entryId) {
  const r = getRecipe(state.viewId);
  const entry = r.cookLog.find(e => e.id === entryId);
  if (!entry) return;
  const actions = [];
  if (entry.photoId && entry.photoId !== r.coverPhotoId) actions.push({ id: 'cover', label: 'Use as cover photo' });
  actions.push({ id: 'delete', label: 'Delete entry', destructive: true });
  const choice = await chooseAction(`${formatDate(entry.date)}`, actions);
  if (choice === 'cover') {
    await saveRecipe({ ...r, coverPhotoId: entry.photoId });
    toast('Cover photo updated');
  } else if (choice === 'delete') {
    if (!confirm('Delete this cook log entry?')) return;
    await saveRecipe({ ...r, cookLog: r.cookLog.filter(e => e.id !== entryId) });
    await deleteUnusedPhotos();
    toast('Entry deleted');
  } else {
    return;
  }
  renderView();
  renderGrid();
}

/* ---------- Backup ---------- */

function bufferToBase64(buffer) {
  const bytes = new Uint8Array(buffer);
  let binary = '';
  for (let i = 0; i < bytes.length; i += 0x8000) binary += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(binary);
}

function base64ToBuffer(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

async function exportBackup() {
  const [recipes, photos] = await Promise.all([db.allRecipes(), db.allPhotos()]);
  const backup = {
    app: 'making-food',
    format: 1,
    exportedAt: new Date().toISOString(),
    recipes,
    photos: photos.map(p => ({ id: p.id, type: p.type, data: bufferToBase64(p.data) })),
  };
  const name = `making-food-backup-${todayISO()}.json`;
  const blob = new Blob([JSON.stringify(backup)], { type: 'application/json' });
  const file = new File([blob], name, { type: 'application/json' });
  // On iPhone the share sheet is the dependable way to save a file ("Save to Files").
  if (navigator.canShare?.({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: name });
      return;
    } catch (err) {
      if (err.name === 'AbortError') return;
    }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

function parseBackup(text) {
  let backup;
  try { backup = JSON.parse(text); } catch { throw new Error('the file is not valid JSON.'); }
  if (backup?.app !== 'making-food' || backup.format !== 1) throw new Error('this is not a Making Food backup.');
  if (!Array.isArray(backup.recipes) || !Array.isArray(backup.photos)) throw new Error('the backup is missing recipes or photos.');
  const recipes = backup.recipes.map(normalizeRecipe);
  if (new Set(recipes.map(r => r.id)).size !== recipes.length) throw new Error('two recipes share the same id.');
  const photos = backup.photos.map(p => {
    if (typeof p?.id !== 'string' || typeof p.data !== 'string') throw new Error('a photo in the file is damaged.');
    let data;
    try { data = base64ToBuffer(p.data); } catch { throw new Error('a photo in the file is damaged.'); }
    return { id: p.id, type: str(p.type).startsWith('image/') ? p.type : 'image/jpeg', data };
  });
  return { recipes, photos };
}

async function importBackup() {
  const input = $('#importInput');
  const file = input.files[0];
  input.value = '';
  if (!file) return;
  try {
    const { recipes, photos } = parseBackup(await file.text());
    const message = `Replace everything in the app with this backup? It has ${recipes.length} recipe${recipes.length === 1 ? '' : 's'} and ${photos.length} photo${photos.length === 1 ? '' : 's'}. The recipes on this phone now will be removed.`;
    if (!confirm(message)) return;
    await run(['recipes', 'photos', 'meta'], 'readwrite', tx => {
      const recipeStore = tx.objectStore('recipes');
      const photoStore = tx.objectStore('photos');
      recipeStore.clear();
      photoStore.clear();
      recipes.forEach(r => recipeStore.put(r));
      photos.forEach(p => photoStore.put(p));
      tx.objectStore('meta').put(true, 'seeded');
    });
    forgetPhotoURLs();
    timers.clear();
    tick();
    state.checks.clear();
    state.recipes = await db.allRecipes();
    closeSheet($('#viewSheet'));
    renderGrid();
    toast('Backup imported');
  } catch (err) {
    toast(`Could not import: ${err.message}`);
  }
}

/* ---------- Wiring ---------- */

function wire() {
  $('#menuBtn').innerHTML = ICONS.more;
  $('#addBtn').innerHTML = ICONS.plus;

  document.querySelectorAll('.top [data-cat]').forEach(b => b.addEventListener('click', () => setCategory(b.dataset.cat)));
  $('#grid').addEventListener('click', e => {
    const card = e.target.closest('.card');
    if (card) openView(card.dataset.id);
  });
  $('#addBtn').addEventListener('click', () => openEdit(null));
  $('#menuBtn').addEventListener('click', async () => {
    const choice = await chooseAction(null, [{ id: 'export', label: 'Export backup' }, { id: 'import', label: 'Import backup' }]);
    if (choice === 'export') exportBackup().catch(err => toast(`Could not export: ${err.message}`));
    if (choice === 'import') $('#importInput').click();
  });
  $('#importInput').addEventListener('change', importBackup);
  $('#coverInput').addEventListener('change', handleCoverFile);

  $('#viewBody').addEventListener('click', e => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const r = getRecipe(state.viewId);
    switch (btn.dataset.action) {
      case 'close-view': closeSheet($('#viewSheet')); break;
      case 'servings-down': if (state.servings > 1) { state.servings--; renderIngredients(); } break;
      case 'servings-up': state.servings++; renderIngredients(); break;
      case 'toggle-check': {
        const checks = checksFor(r.id);
        const i = Number(btn.dataset.index);
        if (checks.has(i)) checks.delete(i); else checks.add(i);
        btn.setAttribute('aria-checked', String(checks.has(i)));
        break;
      }
      case 'timer-toggle': {
        const holder = btn.closest('.timer');
        toggleTimer(holder.dataset.timer, Number(holder.dataset.sec));
        break;
      }
      case 'timer-reset': timers.delete(btn.closest('.timer').dataset.timer); tick(); break;
      case 'log-entry': logEntryActions(btn.dataset.id); break;
    }
  });
  $('#editBtn').addEventListener('click', () => openEdit(state.viewId));
  $('#madeBtn').addEventListener('click', takePhoto);

  $('#editScroll').addEventListener('submit', e => e.preventDefault());
  $('#saveEdit').addEventListener('click', saveEdit);
  $('#cancelEdit').addEventListener('click', cancelEdit);
  editForm().addEventListener('pointerdown', startRowDrag);
  editForm().addEventListener('input', e => {
    if (e.target.matches('.step-row textarea')) autosize(e.target);
  });
  editForm().addEventListener('click', e => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    switch (btn.dataset.action) {
      case 'add-ingredient': {
        $('#ingRows').insertAdjacentHTML('beforeend', ingredientRowHTML({ amount: null, unit: '', name: '' }));
        $('#ingRows').lastElementChild.querySelector('.name').focus();
        break;
      }
      case 'add-step': {
        const rows = $('#stepRows');
        rows.insertAdjacentHTML('beforeend', stepRowHTML({ text: '', timerSec: null }, rows.children.length));
        rows.lastElementChild.querySelector('.text').focus();
        break;
      }
      case 'delete-row': btn.closest('.row').remove(); renumberSteps(); break;
      case 'choose-cover': $('#coverInput').click(); break;
      case 'remove-cover': setEditCover(null); renderCoverField(); break;
      case 'restore-version': {
        const r = getRecipe(state.editing.id);
        const v = r.versions[Number(btn.dataset.index)];
        if (!confirm('Load this older version into the form? Nothing changes until you tap Save.')) return;
        fillEditForm(v.snapshot, r);
        $('#editScroll').scrollTop = 0;
        toast('Older version loaded. Tap Save to keep it.');
        break;
      }
      case 'delete-recipe': deleteRecipe(); break;
    }
  });

  $('#cameraInput').addEventListener('change', handleCapturedFile);
  // If the camera is dismissed without a photo, still let the cook be logged.
  $('#cameraInput').addEventListener('cancel', () => {
    if (!$('#logSheet').classList.contains('open')) openLog();
  });
  $('#saveLog').addEventListener('click', saveLog);
  $('#cancelLog').addEventListener('click', closeLog);
  $('#logForm').addEventListener('click', e => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    switch (btn.dataset.action) {
      case 'log-photo': takePhoto(); break;
      case 'rate': state.log.rating = Number(btn.dataset.value); renderRating(); break;
      case 'log-servings-down': if (state.log.servings > 1) { state.log.servings--; renderLogServings(); } break;
      case 'log-servings-up': state.log.servings++; renderLogServings(); break;
    }
  });
}

async function boot() {
  wire();
  try {
    const saved = localStorage.getItem('category');
    if (CATEGORIES.includes(saved)) state.category = saved;
  } catch { /* storage can be unavailable; the default works */ }
  try {
    await seedIfNeeded();
    state.recipes = await db.allRecipes();
  } catch (err) {
    toast(`Could not open storage: ${err.message}`);
  }
  setCategory(state.category);
  // Asks the browser not to evict this app's data under storage pressure.
  navigator.storage?.persist?.().catch(() => {});
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
}

boot();
</script>
